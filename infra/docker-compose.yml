# Local: MySQL 8.4 + RabbitMQ 4.0.
# Credenciales solo en infra/.env (copiar desde .env.example). Ese archivo no se versiona.
# El vhost mesatech, los usuarios y la topología salen de infra/rabbitmq/ (definitions).
# ms-catalogo publica con el usuario catalogo. ms-solicitudes consume con el usuario solicitudes.

services:
  mysql:
    image: mysql:8.4
    container_name: mesatech-mysql
    hostname: mesatech-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en infra/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catalogo}
      MYSQL_USER: ${MYSQL_USER:?Definir MYSQL_USER en infra/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD en infra/.env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: mesatech-rabbitmq
    hostname: mesatech-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    entrypoint: ["/bin/bash", "/etc/rabbitmq/entrypoint.sh"]
    environment:
      RABBITMQ_CATALOGO_PASSWORD: ${RABBITMQ_CATALOGO_PASSWORD:?Definir RABBITMQ_CATALOGO_PASSWORD en infra/.env}
      RABBITMQ_SOLICITUDES_PASSWORD: ${RABBITMQ_SOLICITUDES_PASSWORD:?Definir RABBITMQ_SOLICITUDES_PASSWORD en infra/.env}
      RABBITMQ_UI_PASSWORD: ${RABBITMQ_UI_PASSWORD:?Definir RABBITMQ_UI_PASSWORD en infra/.env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.template.json:/etc/rabbitmq/definitions.template.json:ro
      - ./rabbitmq/entrypoint.sh:/etc/rabbitmq/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmqctl list_vhosts | grep -qw mesatech"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

volumes:
  mysql_data:
  rabbitmq_data:
