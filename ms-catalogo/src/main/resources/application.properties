spring.application.name=ms-catalogo
server.port=8082

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}

# Sin dialecto fijo: Hibernate lo elige al ver la URL jdbc:mysql.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/catalogo}
spring.datasource.username=${DB_USER:mesatech}
spring.datasource.password=${DB_PASSWORD:mesatech}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Usuario de publicación. No reutilizar el de ms-solicitudes: los permisos son distintos.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:catalogo}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:catalogo-dev}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.connection-timeout=3000
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
