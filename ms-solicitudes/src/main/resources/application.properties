spring.application.name=ms-solicitudes
server.port=8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}

# Sin dialecto fijo: Hibernate lo elige al ver la URL jdbc:mysql.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/solicitudes}
spring.datasource.username=${DB_USER:mesatech}
spring.datasource.password=${DB_PASSWORD:mesatech}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Usuario de consumo. No reutilizar el de ms-catalogo.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:solicitudes}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:solicitudes-dev}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.connection-timeout=3000
